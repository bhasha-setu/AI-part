<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Speak &amp; Learn</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button class="brand" id="brand" type="button" aria-label="Home">Speak &amp; Learn</button>
  <div class="top-actions">
    <button class="icon-btn" id="muteBtn" type="button" aria-pressed="false" aria-label="Mute voice">🔊</button>
    <button class="icon-btn" id="menuBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Menu">⋯</button>
    <div class="menu" id="menu" hidden>
      <button type="button" id="changeCourse">Change course</button>
    </div>
  </div>
</header>
<main id="app" class="col"></main>
<div id="live" class="sr-only" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
